spring:
  application:
    name: content-scraper

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newsdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource.hikari:
    connection-timeout: 20000
    maximum-pool-size: 10
    minimum-idle: 5
  lifecycle:
    timeout-per-shutdown-phase: 30s
  temporal:
    connection:
      target: 127.0.0.1:7233
    namespace: default

app:
  max-retry-count: ${APP_MAX_RETRY_COUNT:3}

logging:
  level:
    root: info
    io.content: info
  file:
    name: logs/news-scraper.log
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[temporal.activity.execution]": true
        "[temporal.workflow.execution]": true
      sla:
        "[http.server.requests]": "50ms,100ms,200ms,300ms,500ms,1s,2s"
    tags:
      application: content-scraper
      environment: ${SPRING_PROFILES_ACTIVE:development}
  tracing:
    sampling:
      probability: 1.0
    zipkin:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
